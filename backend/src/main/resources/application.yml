server:
  port: ${PORT:8080}

spring:
  application:
    name: claimwise-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dummy_secret_for_development_only_please_rotate_in_production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  api-key: ${AI_API_KEY:}
  provider: ${AI_PROVIDER:openai}
  model: ${AI_MODEL:gpt-4o-mini}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:10}
